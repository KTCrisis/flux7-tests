name: Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly — catches drift in flux7-mesh / flux7-memory HEAD
    # even when this repo itself does not change.
    - cron: "0 7 * * 1"

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Checkout flux7-mesh
        uses: actions/checkout@v4
        with:
          repository: KTCrisis/flux7-mesh
          path: .deps/flux7-mesh

      - name: Checkout flux7-memory
        uses: actions/checkout@v4
        with:
          repository: KTCrisis/flux7-memory
          path: .deps/flux7-memory

      - name: Install mesh7
        run: go install ./cmd/mesh7/
        working-directory: .deps/flux7-mesh

      - name: Install mem7
        run: go install ./cmd/mem7/
        working-directory: .deps/flux7-memory

      - name: Run integration suite
        run: go test -tags=integration -v -timeout 2m
